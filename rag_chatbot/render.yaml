services:
  - type: web
    name: rag-chatbot-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: CHAT_MODEL
        value: gemini-3-flash-preview
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
